name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# One run per branch; a new PR push cancels the old run, but never cancel a deploy mid-flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Testing
  test:
    name: Testing
    runs-on: ubuntu-24.04 # pinned so the runner OS only changes when we choose to
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests (coverage gate 85%)
        run: >
          pytest -m "not integration and not e2e" -v
          --junitxml=unit-report.xml
          --cov=app --cov=models --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=85
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            unit-report.xml
            coverage.xml

  # ---------------------------------------------- Test server (CI runner)
  # Builds the image once, runs it beside a fresh PostgreSQL, and runs the
  # integration and end-to-end suites against it. Only an image that passes
  # every suite is pushed to GHCR and promoted to the servers below.
  staging:
    name: Staging (CI runner)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # needed to push the tested image to GHCR
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start staging stack (isolated network + Postgres)
        run: |
          docker network create staging-net
          # Port 5432 is published on localhost only, so the integration tests on
          # this runner can reach the database. Nothing outside the runner can.
          docker run -d --name staging-db --network staging-net -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=appdb \
            postgres:16
          for i in $(seq 1 30); do
            docker exec staging-db pg_isready -U app -d appdb && break
            sleep 2
          done
          # A second, separate database for the integration tests (they drop every
          # table), so they never touch the data the running app is using
          docker exec staging-db createdb -U app apptest
          docker run -d --name app-staging --network staging-net -p 8081:8080 \
            -e DATABASE_URL=postgresql://app:app@staging-db:5432/appdb \
            -e SECRET_KEY=staging-only-key \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health; then
              echo; echo "App is healthy and connected to PostgreSQL"; exit 0
            fi
            sleep 2
          done
          echo "App never became healthy"
          docker logs app-staging
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install test dependencies and browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Integration tests (app against PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/apptest
        run: pytest Tests/integration -m integration -v --junitxml=integration-report.xml

      - name: End-to-end tests (Playwright against the staging container)
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_EXPECTED_VERSION: ${{ github.sha }}
        run: pytest Tests/e2e -m e2e -v --junitxml=e2e-report.xml

      - name: Show container logs
        if: always()
        run: |
          docker logs app-staging > staging-app.log 2>&1 || true
          cat staging-app.log

      - name: Upload staging reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-reports
          path: |
            integration-report.xml
            e2e-report.xml
            staging-app.log
          if-no-files-found: ignore

      # Image is pushed only after it has passed every test above
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Tear down
        if: always()
        run: |
          docker rm -f app-staging staging-db || true
          docker network rm staging-net || true

  # ---------------------------------------------- Staging server (EC2)
  # Runs on pushes to develop and main. If the staging EC2 is offline the job
  # warns and skips instead of failing, so production deploys are not blocked.
  staging-server:
    name: Deploy to staging server
    needs: staging
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST_STAGING }}
      EC2_USER: ec2-user
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY_STAGING }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check staging server is reachable
        id: reach
        run: |
          if ssh -i ~/.ssh/key.pem -o BatchMode=yes -o ConnectTimeout=15 \
               "$EC2_USER@$EC2_HOST" true 2>/dev/null; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Staging server offline::Could not SSH to the staging EC2, so the staging server deploy was skipped."
          fi

      - name: Write app secrets to server
        if: steps.reach.outputs.up == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          SECRET_KEY: ${{ secrets.SECRET_KEY_STAGING }}
        run: |
          printf 'DATABASE_URL=%s\nSECRET_KEY=%s\n' "$DATABASE_URL" "$SECRET_KEY" \
            | ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" "umask 077 && cat > ~/app.env"

      - name: Log in to GHCR on server
        if: steps.reach.outputs.up == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u $GHCR_USER --password-stdin"

      - name: Pull, run and health-check (auto rollback on failure)
        if: steps.reach.outputs.up == 'true'
        run: |
          ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -u
          PREV=\$(docker inspect -f '{{.Config.Image}}' app 2>/dev/null || true)
          # A failed pull must not touch the version that is running now
          docker pull $IMAGE:$GITHUB_SHA || { echo "Pull failed, keeping the current version"; exit 1; }
          docker rm -f app >/dev/null 2>&1 || true
          docker run -d --name app --restart unless-stopped -p 80:8080 \
            --env-file ~/app.env $IMAGE:$GITHUB_SHA
          for i in \$(seq 1 30); do
            if curl -sf http://localhost/health; then
              echo; echo "Staging server is running $GITHUB_SHA and is healthy"
              # Every deploy leaves the previous SHA-tagged image behind; keep three days of them
              docker image prune -af --filter "until=72h" >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed, rolling back"
          docker logs --tail 50 app || true
          docker rm -f app || true
          if [ -n "\$PREV" ]; then
            docker run -d --name app --restart unless-stopped -p 80:8080 --env-file ~/app.env "\$PREV"
            echo "Rolled back to \$PREV"
          fi
          exit 1
          EOF

      - name: Ensure HTTPS proxy (Caddy) is running
        if: steps.reach.outputs.up == 'true'
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN_STAGING }}
        run: |
          printf '{\n\tauto_https disable_redirects\n}\n\nhttps://%s {\n\ttls {\n\t\tissuer acme {\n\t\t\tdisable_http_challenge\n\t\t}\n\t}\n\treverse_proxy localhost:80\n}\n' "$APP_DOMAIN" \
            | ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" "mkdir -p ~/caddy && cat > ~/caddy/Caddyfile"
          ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" \
            "docker rm -f caddy >/dev/null 2>&1 || true; \
             docker run -d --name caddy --restart unless-stopped --network host \
               -v ~/caddy/Caddyfile:/etc/caddy/Caddyfile -v caddy_data:/data caddy:2"

      - uses: actions/setup-python@v6
        if: steps.reach.outputs.up == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install test dependencies and browser
        if: steps.reach.outputs.up == 'true'
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: End-to-end tests against staging server
        if: steps.reach.outputs.up == 'true'
        env:
          E2E_BASE_URL: http://${{ secrets.EC2_HOST_STAGING }}
          E2E_EXPECTED_VERSION: ${{ github.sha }}
        run: pytest Tests/e2e -m e2e -v --junitxml=staging-server-report.xml

      - name: Public HTTPS check
        if: steps.reach.outputs.up == 'true'
        continue-on-error: true # remove once HTTPS is confirmed working
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN_STAGING }}
        run: |
          sleep 15
          curl -sf --retry 5 --retry-delay 3 --retry-connrefused "https://$APP_DOMAIN/health"

      - name: Upload staging server reports
        if: always() && steps.reach.outputs.up == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: staging-server-reports
          path: staging-server-report.xml
          if-no-files-found: ignore

      - name: Remove registry credentials from server
        if: always() && steps.reach.outputs.up == 'true'
        run: ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" "docker logout ghcr.io" || true

  # ------------------------------------------------------------- Production
  deploy:
    name: Deploy to production
    needs: staging-server
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production # add required reviewers in Settings > Environments for a manual approval gate
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ec2-user
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Write app secrets to server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          printf 'DATABASE_URL=%s\nSECRET_KEY=%s\n' "$DATABASE_URL" "$SECRET_KEY" \
            | ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" "umask 077 && cat > ~/app.env"

      - name: Log in to GHCR on server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u $GHCR_USER --password-stdin"

      - name: Pull, run and health-check (auto rollback on failure)
        run: |
          ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -u
          PREV=\$(docker inspect -f '{{.Config.Image}}' app 2>/dev/null || true)
          # A failed pull must not touch the version that is running now
          docker pull $IMAGE:$GITHUB_SHA || { echo "Pull failed, keeping the current version"; exit 1; }
          docker rm -f app >/dev/null 2>&1 || true
          docker run -d --name app --restart unless-stopped -p 80:8080 \
            --env-file ~/app.env $IMAGE:$GITHUB_SHA
          for i in \$(seq 1 30); do
            if curl -sf http://localhost/health; then
              echo; echo "Deployed $GITHUB_SHA and it is healthy"
              # Every deploy leaves the previous SHA-tagged image behind; keep three days of them
              docker image prune -af --filter "until=72h" >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed, rolling back"
          docker logs --tail 50 app || true
          docker rm -f app || true
          if [ -n "\$PREV" ]; then
            docker run -d --name app --restart unless-stopped -p 80:8080 --env-file ~/app.env "\$PREV"
            echo "Rolled back to \$PREV"
          fi
          exit 1
          EOF

      # Proves, from outside AWS, that production is serving this exact commit
      # and that it can reach its RDS database.
      - name: Public smoke test (version and database)
        run: |
          curl -sf --retry 5 --retry-delay 3 --retry-connrefused \
            "http://$EC2_HOST/health" | tee health.json
          echo
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "ok" and .database == "ok" and .version == $sha' health.json
          echo "Production at http://$EC2_HOST is serving $GITHUB_SHA with a working database"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Image | \`$IMAGE:$GITHUB_SHA\` |"
            echo "| URL | http://$EC2_HOST |"
            echo "| Health | \`$(cat health.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials from server
        if: always()
        run: ssh -i ~/.ssh/key.pem "$EC2_USER@$EC2_HOST" "docker logout ghcr.io" || true

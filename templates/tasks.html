<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <style>
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:#1a202c}
   header { background:#dd6b20; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  h1 { margin:0; color:#fff; }
  .user-box { display:flex; align-items:center; gap:1rem; color:#fff; font-size:1rem; line-height:1; }
  .user-box a { color:#fff; text-decoration:none; }
  .user-box a:hover { text-decoration:underline; }
  .user-box span { color:#fff; }
  .user-box form { margin:0; }
  .user-box button { font:inherit; color:#fff; background:transparent; border:1px solid #fff; border-radius:4px; padding:.35rem .8rem; cursor:pointer; }
  .user-box button:hover { background:rgba(255,255,255,.2); }
  header ~ * { margin-left:2rem; margin-right:2rem; }
  header ~ form { margin-top:1.5rem; }
  </style>
</head>
<body>
  <header>
  <h1>Task Tracker</h1>
  <div class="user-box">
    <a href="{{ url_for('links_page') }}" id="links-nav">My links</a>
    <span>Signed in as {{ current_user.username }}</span>
    <form method="post" action="{{ url_for('logout') }}">
      <button type="submit" id="logout-button">Log out</button>
    </form>
  </div>
</header>

  {% if error %}                            
    <p id="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/tasks">
    <input type="text" id="title" name="title" placeholder="New task" required>
    <button type="submit" id="add-task">Add task</button>
  </form>

  <ul id="task-list">                       
    {% for task in tasks %}
      <li>
        <span>{{ task.title }}</span>
        {% if task.done %}
          <span class="badge">Completed</span>
        {% else %}
          <form method="post" action="/tasks/{{ task.id }}/complete" style="display:inline">
            <button type="submit" class="complete-btn">Mark complete</button>
          </form>
        {% endif %}
        <form method="post" action="/tasks/{{ task.id }}/delete" style="display:inline">
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>
  {% include "_footer.html" %}
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Url Shortener</title>
  <style>
    body { margin:0; font-family:AriaL;}
    body { background:#1a202c; color:#e2e8f0; font-family:system-ui,sans-serif; margin:0; }
    header { background:#dd6b20; padding:1rem 2rem; }
    h1 { margin:0; color:#fff; }
    main { max-width:360px; margin:2rem auto; padding:0 1rem; }
    label { display:block; margin-top:1rem; }
    input { width:100%; padding:.6rem; margin-top:.3rem; border-radius:6px; border:1px solid #4a5568; background:#2d3748; color:#e2e8f0; box-sizing:border-box; }
    button { margin-top:1.5rem; width:100%; padding:.7rem; border:0; border-radius:6px; background:#dd6b20; color:#fff; font-size:1rem; cursor:pointer; }
    #error { color:#fc8181; }
    a { color:#f6ad55; }
  </style>
</head>
<body>
  <header><h1>URL Shortener</h1></header>
  <main>
    <h2>Create an account</h2>
    {% if error %}<p id="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('register') }}">
      <label for="username">Username</label>
      <input id="username" name="username" required maxlength="50">
      <label for="password">Password (min 8 characters)</label>
      <input id="password" name="password" type="password" required minlength="8">
      <button id="register-button" type="submit">Register</button>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </main>
</body>
</html>
